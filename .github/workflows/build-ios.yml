name: Build iOS (IPA)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA (macOS Cloud)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Check Xcode Version
        run: |
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Build and Archive iOS App (Cloud Mac)
        run: |
          mkdir -p build
          xcodebuild clean archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration ${{ github.event.inputs.build_type || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -exec cp -r {} build/Payload/ \;
          cd build
          zip -qr QarzDaftari-iOS.ipa Payload
          echo "IPA creation complete:"
          ls -lh QarzDaftari-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QarzDaftari-iOS-IPA
          path: build/QarzDaftari-iOS.ipa
          retention-days: 14

      - name: Upload App Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QarzDaftari-App-xcarchive
          path: build/App.xcarchive
          retention-days: 7
